<style>

<figure><div class="viz"><svg viewBox="0 0 980 310" role="img" aria-label="Fig. 1. The final decision. Four kinds of mind today, one vocabulary, one judge. That is why they can share a map and be read by one census."><defs><marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--accent)"/></marker></defs><rect x="8" y="14" width="400" height="60" rx="5" class="box"/><text x="20" y="36" class="b" text-anchor="start">Rules</text><text x="100" y="36" class="" text-anchor="start">the Commander, with dials</text><text x="20" y="58" class="d sm" text-anchor="start">Fleet, Raider, Castle, Expander, Timid</text><path d="M408 44 H480 V158 H520" class="ar" marker-end="url(#ah2)"/><rect x="8" y="88" width="400" height="60" rx="5" class="box"/><text x="20" y="110" class="b" text-anchor="start">Transform</text><text x="100" y="110" class="" text-anchor="start">the rules, then a net moves the Move</text><text x="20" y="132" class="d sm" text-anchor="start">Overrider</text><text x="400" y="132" class="d sm" text-anchor="end">gate: y2 at least 0.5</text><path d="M408 118 H480 V158 H520" class="ar" marker-end="url(#ah2)"/><rect x="8" y="162" width="400" height="60" rx="5" class="box"/><text x="20" y="184" class="b" text-anchor="start">Net</text><text x="100" y="184" class="" text-anchor="start">143 senses to 47 scores</text><text x="20" y="206" class="d sm" text-anchor="start">Scholar</text><path d="M408 192 H480 V158 H520" class="ar" marker-end="url(#ah2)"/><rect x="8" y="236" width="400" height="60" rx="5" class="box"/><text x="20" y="258" class="b" text-anchor="start">Duel</text><text x="100" y="258" class="" text-anchor="start">the rules, then a champion takes the fight</text><text x="20" y="280" class="d sm" text-anchor="start">Duelist</text><text x="400" y="280" class="d sm" text-anchor="end">gate: y3 above 0</text><path d="M408 266 H480 V158 H520" class="ar" marker-end="url(#ah2)"/><rect x="520" y="118" width="170" height="80" rx="5" class="box"/><text x="605" y="150" class="b" text-anchor="middle">Command</text><text x="605" y="172" class="d sm" text-anchor="middle">Move, FireDirect, Launch</text><path d="M690 158 H740" class="ar" marker-end="url(#ah2)"/><rect x="740" y="118" width="230" height="80" rx="5" class="box"/><text x="855" y="150" class="b" text-anchor="middle">The simulator</text><text x="855" y="172" class="d sm" text-anchor="middle">judges all of them alike</text><text x="520" y="240" class="b" text-anchor="start">A style is one row. The menu chooses a row for each team.</text><text x="520" y="260" class="d sm" text-anchor="start">A new kind of mind is one more row: anything that says Commands.</text></svg></div><figcaption><strong>Fig. 1. The final decision.</strong> Four kinds of mind today, one vocabulary, one judge. That is why they can share a map and be read by one census.</figcaption></figure>
