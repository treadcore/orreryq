<figcaption>Fig. 4. UML of treadcore's three layers, the classes that today's changes touch drawn in full and the rest named. The arrows: World owns a Map and its pillboxes and depots; a Commander is a Brain; a Commander reads its Settings; the window's actions become Commands. What is new is in the accent: a field, a method or a slot added today.</figcaption>
