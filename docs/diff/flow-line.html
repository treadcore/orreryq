<figure>

    <rect x="740" y="185" width="240" height="70" rx="6" fill="var(--tile)" stroke="var(--line)"/>

    <text x="860" y="224" text-anchor="middle" font-size="11" fill="var(--dim)">RANGES as rows, the decrees marked;</text>

  <text x="500" y="505" text-anchor="middle" font-size="12" fill="var(--dim)">A persona's read enters no gate: it is read for what it is, never promoted because a person looked there.</text>

<figcaption>Fig. 3. The line as the planner runs it from 2 November. The left column is the road a trial takes to main; the gates in the accent box are the rules of the last two days. The middle column is the watches on their own clocks; the right what a person moves, now including the hold.</figcaption>
