<figure><div class="viz"><svg viewBox="0 0 980 250" role="img" aria-label="Fig. 10. Computing two brains and mixing them. Four ways to combine sources, each a weight or choice the fleet can read as it reads any other. C is built; A is built for the census. B and D are proposals."><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--accent)"/></marker><marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--s-bad)"/></marker></defs><rect x="10" y="40" width="250" height="56" rx="4" class="box"/><text x="22.0" y="62.0" class="b" text-anchor="start">The rules, with today&#x27;s dials</text><text x="22.0" y="80.0" class="d sm" text-anchor="start">built; how every bot plays</text><rect x="10" y="130" width="250" height="56" rx="4" class="box"/><text x="22.0" y="152.0" class="b" text-anchor="start">A learned net in a slot</text><text x="22.0" y="170.0" class="d sm" text-anchor="start">built for the census; 20 a seat behind</text><rect x="370" y="18" width="380" height="46" rx="4" class="box"/><text x="382.0" y="37.0" class="b" text-anchor="start">A: by seat</text><text x="382.0" y="54.0" class="d sm" text-anchor="start">each tank is one or the other: roles and model</text><path d="M260 68 H330 V41 H370" class="ar" marker-end="url(#ah)"/><path d="M750 41 H810 V110 H830" class="ar" marker-end="url(#ah)"/><rect x="370" y="72" width="380" height="46" rx="4" class="box"/><text x="382.0" y="91.0" class="b" text-anchor="start">B: alternate</text><text x="382.0" y="108.0" class="d sm" text-anchor="start">a tank switches on a slow clock: biorhythm&#x27;s clock</text><path d="M260 68 H330 V95 H370" class="ar" marker-end="url(#ah)"/><path d="M750 95 H810 V110 H830" class="ar" marker-end="url(#ah)"/><rect x="370" y="126" width="380" height="46" rx="4" class="box"/><text x="382.0" y="145.0" class="b" text-anchor="start">C: override when sure</text><text x="382.0" y="162.0" class="d sm" text-anchor="start">the net moves the rules&#x27; point if confident: the patch</text><path d="M260 158 H330 V149 H370" class="ar" marker-end="url(#ah)"/><path d="M750 149 H810 V110 H830" class="ar" marker-end="url(#ah)"/><rect x="370" y="180" width="380" height="46" rx="4" class="box"/><text x="382.0" y="199.0" class="b" text-anchor="start">D: blend</text><text x="382.0" y="216.0" class="d sm" text-anchor="start">both aim; the Move point is a weighted mean</text><path d="M260 158 H330 V203 H370" class="ar" marker-end="url(#ah)"/><path d="M750 203 H810 V110 H830" class="ar" marker-end="url(#ah)"/><rect x="830" y="82" width="140" height="56" rx="4" class="box"/><text x="840.0" y="104.0" class="b" text-anchor="start">A Command</text><text x="840.0" y="122.0" class="d sm" text-anchor="start">and the census reads it</text></svg></div><figcaption><strong>Fig. 10. Computing two brains and mixing them.</strong> Four ways to combine sources, each a weight or choice the fleet can read as it reads any other. C is built; A is built for the census. B and D are proposals.</figcaption></figure>
