<figure><div class="viz"><svg viewBox="0 0 980 230" role="img" aria-label="Fig. 9. Where the record goes. Two kinds of thing, kept in the place that suits each."><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--accent)"/></marker><marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--s-bad)"/></marker></defs><rect x="10" y="24" width="305" height="150" rx="5" class="box"/><text x="22.0" y="48.0" class="b" text-anchor="start">Generations: text</text><text x="22.0" y="68.0" class="d" text-anchor="start">git, a private repo</text><text x="22.0" y="94.0" class="sm" text-anchor="start">Each generation&#x27;s values, evidence,</text><text x="22.0" y="109.0" class="sm" text-anchor="start">families, tests. It diffs.</text><rect x="335" y="24" width="305" height="150" rx="5" class="box"/><text x="347.0" y="48.0" class="b" text-anchor="start">Packs: everything raw</text><text x="347.0" y="68.0" class="d" text-anchor="start">SSD, then GitHub release or disc</text><text x="347.0" y="94.0" class="sm" text-anchor="start">Results, logs, champions, ledgers; xz; each</text><text x="347.0" y="109.0" class="sm" text-anchor="start">file hashed in a manifest.</text><path d="M315 98 H335" class="ar" marker-end="url(#ah)"/><rect x="660" y="24" width="305" height="150" rx="5" class="box"/><text x="672.0" y="48.0" class="b" text-anchor="start">Disc: the long copy</text><text x="672.0" y="68.0" class="d" text-anchor="start">BD-R or M-DISC, by hand</text><text x="672.0" y="94.0" class="sm" text-anchor="start">A pack and its manifest. Readable with tar</text><text x="672.0" y="109.0" class="sm" text-anchor="start">and sha256sum alone.</text><path d="M640 98 H660" class="ar" marker-end="url(#ah)"/><text x="10.0" y="200.0" class="d" text-anchor="start">Each generation writes its record at once. A pack is cut when asked; nothing is deleted and nothing leaves this Mac unless a person sends it.</text></svg></div><figcaption><strong>Fig. 9. Where the record goes.</strong> Two kinds of thing, kept in the place that suits each.</figcaption></figure>
