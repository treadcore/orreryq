ss="ar"/><rect x="272" y="110" width="92" height="96" rx="4" class="box"/><text x="279.0" y="130.0" class="b" text-anchor="start">Check-in</text><text x="279.0" y="148.0" class="d sm" text-anchor="start">a weights file</text><text x="279.0" y="161.0" class="d sm" text-anchor="start">or a slot, with</text><text x="279.0" y="174.0" class="d sm" text-anchor="start">where it came</text><text x="279.0" y="187.0" class="d sm" text-anchor="start">from</text><rect x="372" y="110" width="92" height="96" rx="4" class="box"/><text x="379.0" y="130.0" class="b" text-anchor="start">Preflight</text><text x="379.0" y="148.0" class="d sm" text-anchor="start">tests,</text><text x="379.0" y="161.0" class="d sm" text-anchor="start">families: under</text><text x="379.0" y="174.0" class="d sm" text-anchor="start">a minute</text><path d="M364 158 H372" class="ar" marker-end="url(#ah)"/><rect x="472" y="110" width="92" height="96" rx="4" class="box"/><text x="479.0" y="130.0" class="b" text-anchor="start">Read</text><text x="479.0" y="148.0" class="d sm" text-anchor="start">first and read</text><text x="479.0" y="161.0" class="d sm" text-anchor="start">on</text><path d="M464 158 H472" class="ar" marker-end="url(#ah)"/><rect x="572" y="110" width="92" height="96" rx="4" class="box"/><text x="579.0" y="130.0" class="b" text-anchor="start">Held-out</text><text x="579.0" y="148.0" class="d sm" text-anchor="start">the</text><text x="579.0" y="161.0" class="d sm" text-anchor="start">generation&#x27;s</text><text x="579.0" y="174.0" class="d sm" text-anchor="start">read</text><path d="M564 158 H572" class="ar" marker-end="url(#ah)"/><rect x="672" y="110" width="92" height="96" rx="4" class="box"/><text x="679.0" y="130.0" class="b" text-anchor="start">Line</text><text x="679.0" y="148.0" class="d sm" text-anchor="start">a commit;</text><text x="679.0" y="161.0" class="d sm" text-anchor="start">snapshot</text><path d="M664 158 H672" class="ar" marker-end="url(#ah)"/><rect x="772" y="110" width="92" height="96" rx="4" class="box"/><text x="779.0" y="130.0" class="b" text-anchor="start">Proof</text><text x="779.0" y="148.0" class="d sm" text-anchor="start">z 3 past main</text><path d="M764 158 H772" class="ar" marker-end="url(#ah)"/><rect x="872" y="110" width="92" height="96" rx="4" class="box"/><text x="879.0" y="130.0" class="b" text-anchor="start">Main</text><text x="879.0" y="148.0" class="d sm" text-anchor="start">the game</text><path d="M864 158 H872" class="ar" marker-end="url(#ah)"/><text x="272.0" y="92.0" class="b" text-anchor="start">One road: a proposer only has to produce something the census can seat.</text><text x="272.0" y="236.0" class="d sm" text-anchor="start">Dashed red: the road exists in the census only, or not at all. Every proposer is judged by the same</text><text x="272.0" y="250.0" class="d sm" text-anchor="start">read, so adding one adds no new process: only a way to ask better questions.</text></svg></div><figcaption><strong>Fig. 8. The approach proposed.</strong> Every method is a proposer, and one road judges them all. Preflight is new; the rest is what the dial search already has.</figcaption></figure>
