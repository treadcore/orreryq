<style>
.viz{--s-first:#2a78d6;--s-held:#eb6834;--s-read:#1baf7a;--s-gate:#eda100;--s-guard:#e87ba4;--s-transform:#008300;--s-build:#6250d6;--s-bad:#e34948;--s-gpu:#8a8a84;
 margin:1.4em 0;overflow-x:auto;background:var(--tile);border:1px solid var(--line);border-radius:6px;padding:10px}
.viz svg{display:block;width:100%;min-width:720px;height:auto;font-family:var(--cond)}
.viz text{fill:var(--ink);font-size:12px}.viz .d{fill:var(--dim)}.viz .sm{font-size:10.5px}.viz .b{font-weight:700}
.viz .ln{stroke:var(--line);fill:none}.viz .ar{stroke:var(--accent);fill:none;stroke-width:1.4}.viz .gap{stroke:var(--s-bad);fill:none;stroke-width:1.6;stroke-dasharray:5 3}
.viz .box{fill:var(--panel);stroke:var(--line)}.viz .nb{fill:var(--panel);stroke:var(--s-bad);stroke-width:2;stroke-dasharray:5 3}
.viz .now{stroke:var(--ink);stroke-width:2}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz{--s-first:#3987e5;--s-held:#d95926;--s-read:#199e70;--s-gate:#c98500;--s-guard:#d55181;--s-transform:#008300;--s-build:#9085e9;--s-bad:#e66767;--s-gpu:#8b8a80}}
:root[data-theme="dark"] .viz{--s-first:#3987e5;--s-held:#d95926;--s-read:#199e70;--s-gate:#c98500;--s-guard:#d55181;--s-build:#9085e9;--s-bad:#e66767;--s-gpu:#8b8a80}
</style>
<figure><div class="viz"><svg viewBox="0 0 1180 518" role="img" aria-label="Fig. 1. The whole road. Every stage, what it gives the next, and the machine-time it took in the last day, drawn from tools/plans/line.json and the run. Dashed red: not built, so nothing passes. Only the top two rows reach the game. Hover a box for what it takes and simulates."><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--accent)"/></marker><marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="var(--s-bad)"/></marker></defs><path d="M134 75 H144 V75 H153" class="ar" marker-end="url(#ah)"><title>search to first: trial.weights</title></path><path d="M283 75 H293 V75 H302" class="ar" marker-end="url(#ah)"><title>first to read: z at 55</title></path><path d="M432 75 H442 V75 H451" class="ar" marker-end="url(#ah)"><title>read to held: a pass</title></path><path d="M581 75 H591 V75 H600" class="ar" marker-end="url(#ah)"><title>held to families: a candidate</title></path><path d="M730 75 H740 V75 H749" class="ar" marker-end="url(#ah)"><title>families to promote: its floors</title></path><path d="M879 75 H889 V75 H898" class="ar" marker-end="url(#ah)"><title>promote to build: a commit</title></path><path d="M963 26 V12 H69 V26" class="ar" marker-end="url(#ah)"><title>build to search: new baseline</title></path><path d="M814 124 V148" class="ar" marker-end="url(#ah)"><title>promote to anchor: each generation</title></path><path d="M749 197 H218 V124" class="ar" marker-end="url(#ah)"><title>anchor to first: old values</title></path><path d="M963 124 V148" class="ar" marker-end="url(#ah)"><title>build to proof: the line</title></path><path d="M1028 197 H1038 V197 H1047" class="ar" marker-end="url(#ah)"><title>proof to main: z past 3</title></path><path d="M1112 246 V392" class="ar" marker-end="url(#ah)"><title>main to brain: defaults</title></path><path d="M283 319 H740 V319 H749" class="gap" marker-end="url(#ax)"><title>transform to slot: theta</title></path><path d="M879 319 H1038 V441 H1047" class="gap" marker-end="url(#ax)"><title>slot to brain: not built</title></path><path d="M283 441 H442 V441 H451" class="gap" marker-end="url(#ax)"><title>islands to bridge: champions</title></path><path d="M581 441 H740 V319 H749" class="gap" marker-end="url(#ax)"><title>bridge to slot: not built</title></path><g><title>Propose a trial. Takes: the ledger of every census; RANGES; the defaults. Gives: trial.weights. Simulates: Nothing: this is arithmetic. suggest.py fits the ledger and draws from what it does not yet know; A/B flips each switch and each choice; wide trials look far from today. For treadcore: The source of every number the game&#x27;s bots run on.</title><rect x="4" y="26" width="130" height="98" rx="4" class="box"/><rect x="4" y="26" width="5" height="98" rx="2" fill="var(--s-first)"/><text x="14.0" y="41.0" class="b" text-anchor="start">Propose a trial</text><text x="14.0" y="55.0" class="d sm" text-anchor="start">gives trial.weights</text></g><g><title>First read, 55 seeds. Takes: trial.weights; today&#x27;s binary. Gives: pooled.txt: d +/- se, each map. Simulates: Bots only. Each seed is one starting world on one of eleven maps, played three times so that each team takes the trial seat once: 15 minutes of game time and three respawns, the trial brain against the baseline. For treadcore: Nothing yet: it spends lanes so the long reads go to what might be real.</title><rect x="153" y="26" width="130" height="98" rx="4" class="box"/><rect x="153" y="26" width="5" height="98" rx="2" fill="var(--s-first)"/><text x="163.0" y="41.0" class="b" text-anchor="start">First read, 55 seeds</text><text x="163.0" y="55.0" class="d sm" text-anchor="start">gives pooled.txt: d +/-</text><text x="163.0" y="67.0" class="d sm" text-anchor="start">se, each map</text><text x="163.0" y="118.0" class="d sm" text-anchor="start">1649 jobs, 64.6 h a day</text></g><g><title>Read on, stage by stage. Takes: pooled.txt so far. Gives: pooled z at 82, 124, 187, 275, 418 seeds. Simulates: The same census on fresh seeds. Reads pool by inverse variance, and a trial leaves as soon as its z says keep, drop or pass. For treadcore: Nothing yet: it decides which few earn a held-out read.</title><rect x="302" y="26" width="130" height="98" rx="4" class="box"/><rect x="302" y="26" width="5" height="98" rx="2" fill="var(--s-read)"/><text x="312.0" y="41.0" class="b" text-anchor="start">Read on, stage by</text><text x="312.0" y="55.0" class="b" text-anchor="start">stage</text><text x="312.0" y="69.0" class="d sm" text-anchor="start">gives pooled z at 82,</text><text x="312.0" y="81.0" class="d sm" text-anchor="start">124, 187, 275, 418 seeds</text><text x="312.0" y="118.0" class="d sm" text-anchor="start">1335 jobs, 38.7 h a day</text></g><g><title>Held-out read, 400 seeds. Takes: a trial past the read-on bar. Gives: held d +/- se. Simulates: The census on seeds no search has seen, from 60,000,000 up. Selection has picked out lucky first reads, and only unseen seeds can say so. For treadcore: The evidence every generation&#x27;s commit message carries.</title><rect x="451" y="26" width="130" height="98" rx="4" class="box"/><rect x="451" y="26" width="5" height="98" rx="2" fill="var(--s-held)"/><text x="461.0" y="41.0" class="b" text-anchor="start">Held-out read, 400</text><text x="461.0" y="55.0" class="b" text-anchor="start">seeds</text><text x="461.0" y="69.0" class="d sm" text-anchor="start">gives held d +/- se</text><text x="461.0" y="118.0" class="d sm" text-anchor="start">29 jobs, 8.0 h a day</text></g><g><title>Families hold their floors. Takes: a candidate&#x27;s weights. Gives: plan/families.json: pass or fail by family. Simulates: Set pieces, not whole matches: a raid on a guarded base, a dodge, a kite. Each scenario has a floor a brain must keep. For treadcore: Keeps the behaviours a person notices when the score alone would trade them away.</title><rect x="600" y="26" width="130" height="98" rx="4" class="box"/><rect x="600" y="26" width="5" height="98" rx="2" fill="var(--s-gate)"/><text x="610.0" y="41.0" class="b" text-anchor="start">Families hold their</text><text x="610.0" y="55.0" class="b" text-anchor="start">floors</text><text x="610.0" y="69.0" class="d sm" text-anchor="start">gives</text><text x="610.0" y="81.0" class="d sm" text-anchor="start">plan/families.json: pass</text><text x="610.0" y="93.0" class="d sm" text-anchor="start">or fail by family</text><text x="610.0" y="118.0" class="d sm" text-anchor="start">11 jobs, 0.1 h a day</text></g><g><title>Tests, then the line. Takes: a candidate that held. Gives: a commit: weights.rs and tactics.rs. Simulates: No match: the brain&#x27;s own unit tests on a branch. set-defaults.py rewrites the defaults, and if they pass the commit joins the local line. For treadcore: The generation itself: new defaults in the brain&#x27;s source.</title><rect x="749" y="26" width="130" height="98" rx="4" class="box"/><rect x="749" y="26" width="5" height="98" rx="2" fill="var(--s-gate)"/><text x="759.0" y="41.0" class="b" text-anchor="start">Tests, then the line</text><text x="759.0" y="55.0" class="d sm" text-anchor="start">gives a commit:</text><text x="759.0" y="67.0" class="d sm" text-anchor="start">weights.rs and</text><text x="759.0" y="79.0" class="d sm" text-anchor="start">tactics.rs</text><text x="759.0" y="118.0" class="d sm" text-anchor="start">4 jobs, 0.1 h a day</text></g><g><title>Every machine builds it. Takes: the line&#x27;s commit. Gives: census-bin at the commit, on each machine. Simulates: Nothing: a cargo build per machine. A read counts only on today&#x27;s defaults and today&#x27;s game, so this resets what is asked next. For treadcore: Makes the new brain the baseline everything is read against.</title><rect x="898" y="26" width="130" height="98" rx="4" class="box"/><rect x="898" y="26" width="5" height="98" rx="2" fill="var(--s-build)"/><text x="908.0" y="41.0" class="b" text-anchor="start">Every machine builds</text><text x="908.0" y="55.0" class="b" text-anchor="start">it</text><text x="908.0" y="69.0" class="d sm" text-anchor="start">gives census-bin at the</text><text x="908.0" y="81.0" class="d sm" text-anchor="start">commit, on each machine</text><text x="908.0" y="118.0" class="d sm" text-anchor="start">25 jobs, 0.2 h a day</text></g><g><title>Anchor: back three. Takes: the defaults of three generations ago. Gives: a trial read as any other. Simulates: The census with the old values against today&#x27;s. If the old read better, drift is undone by the same road a find takes. For treadcore: Undoes slow losses.</title><rect x="749" y="148" width="130" height="98" rx="4" class="box"/><rect x="749" y="148" width="5" height="98" rx="2" fill="var(--s-guard)"/><text x="759.0" y="163.0" class="b" text-anchor="start">Anchor: back three</text><text x="759.0" y="177.0" class="d sm" text-anchor="start">gives a trial read as</text><text x="759.0" y="189.0" class="d sm" text-anchor="start">any other</text><text x="759.0" y="240.0" class="d sm" text-anchor="start">2 jobs, 0.1 h a day</text></g><g><title>The line against main. Takes: main&#x27;s values; the line&#x27;s commit. Gives: 2 x 400 seeds: z of line over main. Simulates: The census with main&#x27;s values against the line, on fresh seeds from 700,000,000 up. All the generations&#x27; noise is in one read and cannot pass it by luck. For treadcore: Decides what reaches the game on origin/main.</title><rect x="898" y="148" width="130" height="98" rx="4" class="box"/><rect x="898" y="148" width="5" height="98" rx="2" fill="var(--s-guard)"/><text x="908.0" y="163.0" class="b" text-anchor="start">The line against</text><text x="908.0" y="177.0" class="b" text-anchor="start">main</text><text x="908.0" y="191.0" class="d sm" text-anchor="start">gives 2 x 400 seeds: z</text><text x="908.0" y="203.0" class="d sm" text-anchor="start">of line over main</text><text x="908.0" y="240.0" class="d sm" text-anchor="start">6 jobs, 1.2 h a day</text></g><g><title>Main: the game&#x27;s brain. Takes: a proved line. Gives: origin/main; every player&#x27;s bots. Simulates: Nothing: a push. Every machine fetches it, and a release carries it to players. For treadcore: All of it: Commander, tactics, crew and fleet read these defaults in every match.</title><rect x="1047" y="148" width="130" height="98" rx="4" class="box"/><rect x="1047" y="148" width="5" height="98" rx="2" fill="var(--s-gate)"/><text x="1057.0" y="163.0" class="b" text-anchor="start">Main: the game&#x27;s</text><text x="1057.0" y="177.0" class="b" text-anchor="start">brain</text><text x="1057.0" y="191.0" class="d sm" text-anchor="start">gives origin/main; every</text><text x="1057.0" y="203.0" class="d sm" text-anchor="start">player&#x27;s bots</text></g><g><title>Transform: learned override. Takes: the senses, the rules&#x27; answer, the biorhythm. Gives: patches/theta.json: 942 numbers. Simulates: The same census with the patch switched on, SPSA moving all 942 numbers by one noisy read a step. All zeros is the brain as it was. For treadcore: Nothing yet: the census reads the slot and the game does not.</title><rect x="153" y="270" width="130" height="98" rx="4" class="box"/><rect x="153" y="270" width="5" height="98" rx="2" fill="var(--s-transform)"/><text x="163.0" y="285.0" class="b" text-anchor="start">Transform: learned</text><text x="163.0" y="299.0" class="b" text-anchor="start">override</text><text x="163.0" y="313.0" class="d sm" text-anchor="start">gives</text><text x="163.0" y="325.0" class="d sm" text-anchor="start">patches/theta.json: 942</text><text x="163.0" y="337.0" class="d sm" text-anchor="start">numbers</text><text x="163.0" y="362.0" class="d sm" text-anchor="start">28 jobs, 0.7 h a day</text></g><g><title>The game reads a slot. Takes: a patch that read better. Gives: NOT BUILT: a file the game loads. Simulates: Nothing: this is missing. For treadcore: Would add learned play to the shipped brain.</title><rect x="749" y="270" width="130" height="98" rx="4" class="nb"/><rect x="749" y="270" width="5" height="98" rx="2" fill="var(--s-transform)"/><text x="759.0" y="285.0" class="b" text-anchor="start">The game reads a</text><text x="759.0" y="299.0" class="b" text-anchor="start">slot</text><text x="759.0" y="313.0" class="d sm" text-anchor="start">NOT BUILT</text></g><g><title>GPU islands: crucible. Takes: champions from the other islands; the ladder. Gives: champ.bin, gens.tsv, exam.tsv. Simulates: Crucible&#x27;s own arena on the card: 2,048 small nets duelling, 128 episodes, 100 generations a segment. Different physics, senses and net from the game. For treadcore: Nothing: its nets cannot play treadcore.</title><rect x="153" y="392" width="130" height="98" rx="4" class="box"/><rect x="153" y="392" width="5" height="98" rx="2" fill="var(--s-gpu)"/><text x="163.0" y="407.0" class="b" text-anchor="start">GPU islands:</text><text x="163.0" y="421.0" class="b" text-anchor="start">crucible</text><text x="163.0" y="435.0" class="d sm" text-anchor="start">gives champ.bin,</text><text x="163.0" y="447.0" class="d sm" text-anchor="start">gens.tsv, exam.tsv</text><text x="163.0" y="484.0" class="d sm" text-anchor="start">277 jobs, 9.9 h a day</text></g><g><title>Bridge: crucible to treadcore. Takes: a champion. Gives: NOT BUILT: a net in the game&#x27;s senses. Simulates: Nothing: this is missing. It would be imitation: the champion&#x27;s choices taught to a net that reads treadcore&#x27;s senses. For treadcore: Would make GPU work count.</title><rect x="451" y="392" width="130" height="98" rx="4" class="nb"/><rect x="451" y="392" width="5" height="98" rx="2" fill="var(--s-gpu)"/><text x="461.0" y="407.0" class="b" text-anchor="start">Bridge: crucible to</text><text x="461.0" y="421.0" class="b" text-anchor="start">treadcore</text><text x="461.0" y="435.0" class="d sm" text-anchor="start">NOT BUILT</text></g><g><title>One brain in treadcore. Takes: main, and a slot. Gives: rules, dials and transform as one. Simulates: A real match: rules, then dials, then a learned override. For treadcore: The goal.</title><rect x="1047" y="392" width="130" height="98" rx="4" class="box"/><rect x="1047" y="392" width="5" height="98" rx="2" fill="var(--s-gate)"/><text x="1057.0" y="407.0" class="b" text-anchor="start">One brain in</text><text x="1057.0" y="421.0" class="b" text-anchor="start">treadcore</text><text x="1057.0" y="435.0" class="d sm" text-anchor="start">gives rules, dials and</text><text x="1057.0" y="447.0" class="d sm" text-anchor="start">transform as one</text></g></svg></div><figcaption><strong>Fig. 1. The whole road.</strong> Every stage, what it gives the next, and the machine-time it took in the last day, drawn from <code>tools/plans/line.json</code> and the run. Dashed red: not built, so nothing passes. Only the top two rows reach the game. Hover a box for what it takes and simulates.</figcaption></figure>
