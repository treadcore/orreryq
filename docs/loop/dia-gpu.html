<div class="ogv"><svg viewBox="0 0 960 400" role="img" aria-label="Diagram 3: what more CUDA cards speed, and what they do not"><rect x="20" y="20" width="190" height="44" rx="6" class="gpu"/><text x="30.0" y="38.0" text-anchor="start" class="ttl">N cards</text><text x="30.0" y="54.0" text-anchor="start" class="dim num">an island each; today 3</text><rect x="320" y="10" width="238" height="58" rx="6" class="cpu"/><text x="330.0" y="28.0" text-anchor="start" class="ttl">proposals: x N</text><text x="330.0" y="44.0" text-anchor="start" class="dim num">champions an hour and milestones</text><text x="330.0" y="58.0" text-anchor="start" class="dim num">a day rise with the cards</text><rect x="320" y="90" width="231" height="58" rx="6" class="cpu"/><text x="330.0" y="108.0" text-anchor="start" class="ttl">breadth: N lineages</text><text x="330.0" y="124.0" text-anchor="start" class="dim num">each island its own population;</text><text x="330.0" y="138.0" text-anchor="start" class="dim num">the game&#x27;s net seeds them all</text><rect x="320" y="170" width="285" height="58" rx="6" class="cpu"/><text x="330.0" y="188.0" text-anchor="start" class="ttl">the wait for a credited net</text><text x="330.0" y="204.0" text-anchor="start" class="dim num">1 - (1 - p)^N a day, p a card&#x27;s chance:</text><text x="330.0" y="218.0" text-anchor="start" class="dim num">about 2.7 days at 3 cards, 1.7 at 6</text><path d="M210.0,42.0 L318.0,39.0" class="wire"/><polygon points="318.0,39.0 311.0,42.8 310.8,35.6" style="fill:var(--dim)"/><path d="M210.0,42.0 L318.0,119.0" class="wire"/><polygon points="318.0,119.0 310.1,117.8 314.3,111.9" style="fill:var(--dim)"/><path d="M210.0,42.0 L318.0,199.0" class="wire"/><polygon points="318.0,199.0 311.0,195.2 317.0,191.1" style="fill:var(--dim)"/><rect x="668" y="10" width="245" height="58" rx="6" class="cpu"/><text x="678.0" y="28.0" text-anchor="start" class="ttl">the bridge: x N reads</text><text x="678.0" y="44.0" text-anchor="start" class="dim num">384 seeds a milestone: at 6 cards</text><text x="678.0" y="58.0" text-anchor="start" class="dim num">about 2% of the CPU fleet</text><path d="M558.4,39.0 L666.0,39.0" class="wire"/><polygon points="666.0,39.0 658.9,42.6 658.9,35.4" style="fill:var(--dim)"/><rect x="668" y="170" width="220" height="58" rx="6" class="main"/><text x="678.0" y="188.0" text-anchor="start" class="ttl">a better Gladiator, sooner</text><text x="678.0" y="204.0" text-anchor="start" class="dim num">only if the arena rewards</text><text x="678.0" y="218.0" text-anchor="start" class="dim num">what the game does</text><path d="M605.3,199.0 L666.0,199.0" class="wire"/><polygon points="666.0,199.0 658.9,202.6 658.9,195.4" style="fill:var(--dim)"/><path d="M790.5,68.0 L778.0,168.0" class="wire"/><polygon points="778.0,168.0 775.3,160.5 782.5,161.4" style="fill:var(--dim)"/><rect x="20" y="270" width="493" height="86" rx="6" class="box"/><text x="30.0" y="288.0" text-anchor="start" class="ttl">what a card does not speed</text><text x="30.0" y="304.0" text-anchor="start" class="dim num">The dials of the game&#x27;s own brain are read in whole games on the CPUs:</text><text x="30.0" y="318.0" text-anchor="start" class="dim num">178,000 seeds a day whatever the cards. A card reads no census.</text><text x="30.0" y="332.0" text-anchor="start" class="dim num">And the arena agreed with the game at -0.40 over 22 milestones:</text><text x="30.0" y="346.0" text-anchor="start" class="dim num">more cards make more of what the arena likes.</text><rect x="668" y="270" width="220" height="58" rx="6" class="box"/><text x="678.0" y="288.0" text-anchor="start" class="ttl">so, before the fourth card</text><text x="678.0" y="304.0" text-anchor="start" class="dim num">mend the exam; keep the</text><text x="678.0" y="318.0" text-anchor="start" class="dim num">game&#x27;s verdict coming back</text><rect x="20" y="376" width="16" height="12" rx="2" class="gpu"/><text x="42.0" y="386.0" text-anchor="start" class="">data: what is kept, and where</text><rect x="340" y="376" width="16" height="12" rx="2" class="cpu"/><text x="362.0" y="386.0" text-anchor="start" class="">a function, by its name in the code</text><rect x="660" y="376" width="16" height="12" rx="2" class="main"/><text x="682.0" y="386.0" text-anchor="start" class="">an outcome</text></svg></div>
