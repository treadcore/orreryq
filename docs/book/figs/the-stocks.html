<figure>
<svg viewBox="0 0 900 460" width="100%" role="img" aria-label="The four stocks of the designed economy and where each goes" style="font-family: var(--cond); max-width: 900px;">
  <defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
  <g font-size="14" fill="var(--ink)">
    <!-- sources -->
    <rect x="20" y="30" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--up)" stroke-width="2"/>
    <text x="105" y="52" text-anchor="middle" font-weight="700">forest</text><text x="105" y="72" text-anchor="middle" font-size="12" fill="var(--up)">regrows: the one renewable</text>
    <rect x="20" y="130" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="105" y="152" text-anchor="middle" font-weight="700">ore deposits</text><text x="105" y="172" text-anchor="middle" font-size="12" fill="var(--dim)">a fixed stock a map</text>
    <rect x="20" y="230" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="105" y="252" text-anchor="middle" font-weight="700">oil wells</text><text x="105" y="272" text-anchor="middle" font-size="12" fill="var(--dim)">a fixed stock a map</text>
    <rect x="20" y="330" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="105" y="352" text-anchor="middle" font-weight="700">holdings and kills</text><text x="105" y="372" text-anchor="middle" font-size="12" fill="var(--dim)">earned, not mined</text>
    <!-- works -->
    <rect x="260" y="30" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="345" y="52" text-anchor="middle" font-weight="700">harvester</text><text x="345" y="72" text-anchor="middle" font-size="12" fill="var(--dim)">six a tile, not four</text>
    <rect x="260" y="130" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="345" y="152" text-anchor="middle" font-weight="700">smelter</text><text x="345" y="172" text-anchor="middle" font-size="12" fill="var(--dim)">ore to shells, one a second</text>
    <rect x="260" y="230" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="345" y="252" text-anchor="middle" font-weight="700">refinery</text><text x="345" y="272" text-anchor="middle" font-size="12" fill="var(--dim)">oil to fuel; half the burn</text>
    <rect x="260" y="330" width="170" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="345" y="352" text-anchor="middle" font-weight="700">supply</text><text x="345" y="372" text-anchor="middle" font-size="12" fill="var(--dim)">upgrades, and trade</text>
    <!-- stocks -->
    <rect x="500" y="30" width="150" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="575" y="52" text-anchor="middle" font-weight="700">wood</text><text x="575" y="72" text-anchor="middle" font-size="12" fill="var(--dim)">roads, walls, boats</text>
    <rect x="500" y="130" width="150" height="54" rx="6" fill="var(--tile)" stroke="var(--accent)" stroke-width="2"/>
    <text x="575" y="152" text-anchor="middle" font-weight="700">the depot's shells</text><text x="575" y="172" text-anchor="middle" font-size="12" fill="var(--dim)">no ore, no refill</text>
    <rect x="500" y="230" width="150" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="575" y="252" text-anchor="middle" font-weight="700">fuel</text><text x="575" y="272" text-anchor="middle" font-size="12" fill="var(--dim)">tanks, drone batteries</text>
    <rect x="500" y="330" width="150" height="54" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="575" y="352" text-anchor="middle" font-weight="700">an ally's depot</text><text x="575" y="372" text-anchor="middle" font-size="12" fill="var(--dim)">payout by distance</text>
    <!-- the pillbox -->
    <rect x="720" y="110" width="160" height="94" rx="6" fill="var(--tile)" stroke="var(--accent)" stroke-width="2"/>
    <text x="800" y="136" text-anchor="middle" font-weight="700">a pillbox's stock</text>
    <text x="800" y="158" text-anchor="middle" font-size="12" fill="var(--dim)">filled by the workers</text>
    <text x="800" y="178" text-anchor="middle" font-size="12" fill="var(--accent)">hit: it all goes up;</text>
    <text x="800" y="194" text-anchor="middle" font-size="12" fill="var(--accent)">one shell in ten seconds after</text>
    <text x="450" y="440" text-anchor="middle" font-size="13" fill="var(--dim)">The workers are a base's own squad: they carry along the roads, repair, and build what the city's plan says next. Nothing here is built; chapter 13 stages it in four game versions.</text>
  </g>
  <g stroke="var(--accent)" stroke-width="1.5" fill="none" marker-end="url(#arr3)">
    <path d="M190 57 L258 57"/><path d="M430 57 L498 57"/>
    <path d="M190 157 L258 157"/><path d="M430 157 L498 157"/><path d="M650 157 L718 157"/>
    <path d="M190 257 L258 257"/><path d="M430 257 L498 257"/>
    <path d="M190 357 L258 357"/><path d="M430 357 L498 357"/>
  </g>
</svg>
<figcaption>Fig. 4. The designed economy: four stocks, one renewable, each with the works that improves it and the place it goes. The two boxes outlined in the accent are the zero-sum rule and the logistics rule: shells come from ore, and a hit pillbox loses what it held.</figcaption>
</figure>
