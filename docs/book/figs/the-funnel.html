<figure>
<svg viewBox="0 0 900 420" width="100%" role="img" aria-label="The line as a funnel: from trials to main, with what each stage keeps" style="font-family: var(--cond); max-width: 900px;">
  <g font-size="15" fill="var(--ink)">
    <rect x="40" y="20" width="820" height="40" rx="5" fill="var(--tile)" stroke="var(--line)"/>
    <text x="52" y="46">trials: the fit's draws, A/B of switches and choices, the far read, the temperament round, the width watch, the anchors</text>
    <text x="848" y="46" text-anchor="end" fill="var(--dim)" font-size="13">about 2,000 in the week</text>
    <rect x="100" y="80" width="700" height="40" rx="5" fill="var(--tile)" stroke="var(--line)"/>
    <text x="112" y="106">read on until decided: 55, 110, 220, 440 seeds; dropped two errors under</text>
    <text x="788" y="106" text-anchor="end" fill="var(--dim)" font-size="13">about a tenth survive</text>
    <rect x="160" y="140" width="580" height="40" rx="5" fill="var(--tile)" stroke="var(--line)"/>
    <text x="172" y="166">held out: two reads of 400 seeds, pooled; z 3, no map under</text>
    <text x="728" y="166" text-anchor="end" fill="var(--dim)" font-size="13">a candidate</text>
    <rect x="220" y="200" width="460" height="40" rx="5" fill="var(--tile)" stroke="var(--accent)" stroke-width="2"/>
    <text x="232" y="226">the gates: a quarter point, the settling rule, the trade guard, the hold</text>
    <rect x="280" y="260" width="340" height="40" rx="5" fill="var(--tile)" stroke="var(--line)"/>
    <text x="292" y="286">the brain's tests and nine families</text>
    <text x="608" y="286" text-anchor="end" fill="var(--dim)" font-size="13">a generation</text>
    <rect x="340" y="320" width="220" height="40" rx="5" fill="var(--tile)" stroke="var(--line)"/>
    <text x="352" y="346">the proof: 800 seeds, hourly</text>
    <rect x="400" y="380" width="100" height="34" rx="5" fill="var(--accent)"/>
    <text x="450" y="403" text-anchor="middle" fill="var(--base)" font-weight="700">main</text>
  </g>
  <g fill="var(--accent)" font-size="13" font-family="var(--mono)">
    <text x="20" y="46" text-anchor="end" transform="translate(22,0)"></text>
  </g>
  <g stroke="var(--accent)" stroke-width="1.5" fill="none">
    <path d="M450 60 L450 80"/><path d="M450 120 L450 140"/><path d="M450 180 L450 200"/><path d="M450 240 L450 260"/><path d="M450 300 L450 320"/><path d="M450 360 L450 380"/>
  </g>
</svg>
<figcaption>Fig. 2. The line as a funnel. Every stage keeps less; the gates in the middle are the rules of 1 and 2 November (a floor on the gain, a dial that moved recently needs full z 3, a candidate that gives up building or fights waits for a person). Main moved eight times in the week.</figcaption>
</figure>
