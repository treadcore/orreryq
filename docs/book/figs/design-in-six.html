<figure>
<svg viewBox="0 0 900 300" width="100%" role="img" aria-label="The design in six parts, each with its state on 2 November 2026" style="font-family: var(--cond); max-width: 900px;">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
  <g font-size="15" fill="var(--ink)">
    <rect x="20" y="30" width="260" height="90" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="150" y="62" text-anchor="middle" font-weight="700">1 The design</text>
    <text x="150" y="88" text-anchor="middle" font-size="13" fill="var(--dim)">rules, the brain's shape, the process</text>
    <text x="150" y="108" text-anchor="middle" font-size="13" fill="var(--up)">written</text>
    <rect x="320" y="30" width="260" height="90" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="450" y="62" text-anchor="middle" font-weight="700">2 The implementation</text>
    <text x="450" y="88" text-anchor="middle" font-size="13" fill="var(--dim)">the game, the brains, the console</text>
    <text x="450" y="108" text-anchor="middle" font-size="13" fill="var(--up)">shipped, 0.2.0</text>
    <rect x="620" y="30" width="260" height="90" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="750" y="62" text-anchor="middle" font-weight="700">3 Weights training</text>
    <text x="750" y="88" text-anchor="middle" font-size="13" fill="var(--dim)">censuses, the line, the proof</text>
    <text x="750" y="108" text-anchor="middle" font-size="13" fill="var(--up)">running: a week of it</text>
    <rect x="620" y="180" width="260" height="90" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="750" y="212" text-anchor="middle" font-weight="700">4 Transform training</text>
    <text x="750" y="238" text-anchor="middle" font-size="13" fill="var(--dim)">a learned stage after the rules</text>
    <text x="750" y="258" text-anchor="middle" font-size="13" fill="var(--accent)">built; one in a slot, not promoted</text>
    <rect x="320" y="180" width="260" height="90" rx="6" fill="var(--tile)" stroke="var(--line)"/>
    <text x="450" y="212" text-anchor="middle" font-weight="700">5 Combining the two</text>
    <text x="450" y="238" text-anchor="middle" font-size="13" fill="var(--dim)">Overrider, Duelist; a net that cannot build</text>
    <text x="450" y="258" text-anchor="middle" font-size="13" fill="var(--accent)">exists; twenty points behind</text>
    <rect x="20" y="180" width="260" height="90" rx="6" fill="var(--tile)" stroke="var(--accent)" stroke-width="2"/>
    <text x="150" y="212" text-anchor="middle" font-weight="700">6 Orrery orchestrating</text>
    <text x="150" y="238" text-anchor="middle" font-size="13" fill="var(--dim)">seeds, promotion, values, dependencies</text>
    <text x="150" y="258" text-anchor="middle" font-size="13" fill="var(--up)">built; its faults were the lesson</text>

  <g stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#arr)">

<figcaption>Fig. 1. The design in six parts, as Paul set it on 2 November, with where each stands. The sixth feeds the first: what orrery measures rewrites the design.</figcaption>
</figure>
