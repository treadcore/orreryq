<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orreryq card</title>
<!-- The social card: what a link to orreryq.com or the repository shows (1280 by 640). Drawn from the
     site's own stylesheet and battlefield, then photographed:
       Chrome --headless=new --window-size=1280,640 --screenshot=docs/site/card.png docs/site/card.html
     GitHub's social preview takes the PNG by hand (Settings, General, Social preview); the site's
     og:image names it. -->
<link rel="stylesheet" href="assets/site.css">
<style>
html,body{width:1280px;height:640px;overflow:hidden;margin:0}
.card{position:relative;z-index:2;display:grid;grid-template-columns:560px 1fr;gap:40px;align-items:center;height:640px;padding:0 48px;box-sizing:border-box}
.card .plate{padding:34px 36px 30px;border-radius:18px}
.card .eyebrow{margin:0 0 .5rem;font-size:.82rem}
.card h1{margin:0 0 1rem;font:900 5.2rem/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.card .lcd{margin:0 0 1.1rem;padding:1rem 1.1rem;font:600 1.05rem/1.45 var(--mono);border-radius:8px}
.card .lcd b{color:var(--lit)}
.card .meta{margin:0;font:700 .9rem/1.3 var(--mono);letter-spacing:.06em}
.card .monitor{transform:perspective(1400px) rotateY(-9deg);transform-origin:left center}
.card .monitor img{display:block;width:100%;image-rendering:auto}
</style>
</head>
<body>
<canvas class="field" aria-hidden="true"></canvas><div class="veil" aria-hidden="true"></div>
<div class="card">
<div class="plate metal screws"><span class="foot"></span>
<p class="eyebrow label etched">The Orrery Queue &middot; nine machines &middot; one brain</p>
<h1 class="etched">Orreryq</h1>
<p class="lcd screen scan phos">A room of ordinary machines, one queue, and the console that runs them. <b>A planner guesses a number, the machines read it, and what holds goes into the game.</b></p>
<p class="meta etched">orreryq.com &middot; github.com/treadcore/orreryq</p>
</div>
<div class="monitor metal"><div class="screen"><img src="guide/guide-loop.svg" alt=""><span class="sheen"></span></div></div>
</div>
<script src="assets/field.js"></script>
</body>
</html>
